[project]
name = "doc-assistant-api"
version = "0.1.0"
description = "Document Assistant backend: FastAPI api and Procrastinate worker."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.5.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "ebooklib>=0.21",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "openai>=3.46.0",
    "pgvector>=0.5.1",
    "procrastinate>=3.10.0",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pymupdf4llm>=2.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Generated by Alembic; keep its layout.
"migrations/versions/*" = ["E501", "I001", "UP"]
# Tests name the behaviour in the function name; no docstrings, annotations or line limit needed.
"tests/**" = ["D", "ANN", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf4llm", "docx.*", "pptx.*", "ebooklib.*", "trafilatura", "lxml.*", "pgvector.*"]
ignore_missing_imports = true

# NOTE: The four SDK adapters pass plain dicts to typed SDK calls; mypy and pyright are relaxed for
# these modules only (checked by running the providers, see docs/checks).
[[tool.mypy.overrides]]
module = [
    "app.providers.anthropic_provider",
    "app.providers.openai_provider",
    "app.providers.google_provider",
    "app.providers.ollama_provider",
]
ignore_errors = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85"
filterwarnings = ["ignore::DeprecationWarning"]
