name: doc-assistant-e2e

# Throwaway stack for the browser tests (`make test-e2e`): fake model provider, fixed fake hardware,
# local web pages for the URL import, nothing persisted. Reachable at http://127.0.0.1:8090.
x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://e2e:e2e@db:5432/e2e
  FERNET_KEY: kJ0tYB1xKq7mV3m1R2yQ0m5mZkq5w3lS9nq8X2sVt1A=
  FILES_DIR: /data/files
  FAKE_PROVIDERS: "1"
  ALLOW_PRIVATE_URLS: "1"
  HARDWARE_JSON: /data/e2e/hardware.json

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ../apps/api
    environment: *api-env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ../apps/web/e2e/hardware.json:/data/e2e/hardware.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 5s
      retries: 40

  worker:
    build: ../apps/api
    environment: *api-env
    command: procrastinate --app=app.jobs.app.procrastinate_app worker
    depends_on:
      api:
        condition: service_healthy

  # Web pages the URL import tests fetch (http://fixtures:8000/...).
  fixtures:
    image: python:3.13-slim
    working_dir: /srv/fixtures
    command: python -m http.server 8000
    volumes:
      - ../apps/web/e2e/fixtures:/srv/fixtures:ro

  proxy:
    build:
      context: ..
      dockerfile: infra/Dockerfile.proxy
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - api
