name: doc-assistant

# NOTE: Run with `make up`; the .env file lives next to this file (see .env.example).

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  FERNET_KEY: ${FERNET_KEY}
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  FILES_DIR: /data/files

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Localhost only: lets alembic and psql on the host reach the database.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../apps/api
    restart: unless-stopped
    environment: *api-env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - files:/data/files
      - ./hardware:/data/hardware:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: ../apps/api
    restart: unless-stopped
    environment: *api-env
    command: procrastinate --app=app.jobs.app.procrastinate_app worker
    volumes:
      - files:/data/files
    depends_on:
      api:
        condition: service_healthy

  proxy:
    build:
      context: ..
      dockerfile: infra/Dockerfile.proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:80"
    depends_on:
      - api

  # Own Ollama; skip this profile if the recipe app's Ollama is shared (set OLLAMA_URL).
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  files:
  ollama:
