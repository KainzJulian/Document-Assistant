# Retrieval questions (W4.4). YOU write about 20 of these for your own documents; three examples
# for the generated samples in eval/extraction/samples are included so the runner works at once.
#
# id:        any label
# question:  the question as a person would ask it
# documents: titles of the library documents to search in (exact title as shown in the library)
# expect:    a phrase that must appear in one of the top 8 passages for the question to count as a hit
#
# Upload the sample files first (bericht-de.pdf has the title "Mietvertrag Wohnung Linz").
# W8 adds 20 answer questions with expected answers in eval/rag/answers.yaml.

- id: example-1
  question: Wie lange ist die Kündigungsfrist des Mieters?
  documents: ["Mietvertrag Wohnung Linz"]
  expect: "drei Monaten"

- id: example-2
  question: Wann ist eine vorzeitige Auflösung des Vertrages möglich?
  documents: ["Mietvertrag Wohnung Linz"]
  expect: "Zustimmung beider Parteien"

- id: example-3
  question: Which energy sources delivered most of the growth?
  documents: ["Annual Report Energy"]
  expect: "Solar plants"
